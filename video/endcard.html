<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>End card</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style> .strip { position: absolute; left: 0; bottom: 0; width: 100%; height: 26px; background: repeating-linear-gradient(90deg, var(--lapis) 0 80px, var(--gold) 80px 160px, var(--faience) 160px 240px); } </style></head>
<body>
<!-- ?mode=quote shows the closing line; ?mode=url shows the live URL card -->
<section class="slide" id="s">
  <div id="quote" style="position:absolute; left:140px; right:140px; top:250px; text-align:center">
    <p style="font-size:72px; font-weight:700; line-height:1.25; color:var(--ink)">In 1978, computers diagnosed children&rsquo;s maths bugs.</p>
    <p style="font-size:84px; font-weight:800; line-height:1.2; color:var(--lapis); margin-top:44px">Now children debug the computer.</p>
  </div>
  <div id="url" style="position:absolute; left:0; right:0; top:90px; text-align:center">
    <div style="width:420px; margin:0 auto"><!--AHMES-HAPPY--></div>
    <h1 style="font-size:130px; margin-top:6px">Teach Ahmes</h1>
    <p style="font-size:60px; font-weight:700; color:var(--ink); margin-top:36px">64-177-33-215.sslip.io</p>
    <p style="font-size:38px; color:var(--faience); font-weight:600; margin-top:20px">Built on Vultr for Agent Rush</p>
    <p style="font-size:27px; color:var(--muted); margin-top:26px">A prototype. Learning outcomes untested. Typed text and synthetic voices only.</p>
  </div>
  <div class="strip"></div>
</section>
<script>
  const m = new URLSearchParams(location.search).get("mode") || "quote";
  document.getElementById(m === "url" ? "quote" : "url").style.display = "none";
</script>
</body></html>
