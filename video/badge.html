<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent} .b{position:absolute;left:60px;top:24px;background:#fff;border:6px solid var(--c);border-radius:36px;padding:16px 34px;font-family:Lexend,sans-serif;text-align:center;box-shadow:0 10px 0 rgba(22,34,74,.18)}
.n{font-size:104px;font-weight:800;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}.l{font-size:28px;font-weight:600;color:#16224A;margin-top:8px}</style></head>
<body><div class="b" id="b"><div class="n" id="n"></div><div class="l" id="l"></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById("n").textContent=q.get("n");document.getElementById("l").textContent=q.get("l");
document.getElementById("b").style.setProperty("--c",q.get("c")||"#2449A8");</script></body></html>
