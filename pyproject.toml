[project]
name = "teach-ahmes"
version = "0.1.0"
description = "A child teaches Ahmes, a robot classmate, fractions and decimals. Her words become his code, run in a throwaway Vultr sandbox."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
